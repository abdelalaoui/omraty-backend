spring:
  application:
    name: omraty-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omraty}
    username: ${DB_USERNAME:omraty}
    password: ${DB_PASSWORD:omraty}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment-min-32-chars}
  accessTokenExpirationMinutes: ${JWT_ACCESS_EXP_MINUTES:15}
  refreshTokenExpirationDays: ${JWT_REFRESH_EXP_DAYS:30}

app:
  vip:
    offer-expiration-hours: ${VIP_OFFER_EXPIRATION_HOURS:24}
  upload:
    provider: ${UPLOAD_PROVIDER:local} # local | s3
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:/uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:eu-west-3}
