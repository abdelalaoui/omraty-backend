spring:
  application:
    name: omraty-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omraty}
    username: ${DB_USERNAME:omraty}
    password: ${DB_PASSWORD:omraty}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Les PRs de features indépendantes ajoutent chacune leurs migrations, mais sont mergées dans
    # leur ordre de dépendance plutôt que dans l'ordre numérique des migrations (ex. le 26/09/2026 :
    # V34 est passée en prod avant V32/V33) — sans ce réglage, Flyway refuse de démarrer ("Detected
    # resolved migration not applied to database"). Chaque migration reste indépendante des autres
    # (voir leur contenu), l'appliquer hors ordre est donc sans risque.
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment-min-32-chars}
  accessTokenExpirationMinutes: ${JWT_ACCESS_EXP_MINUTES:15}
  refreshTokenExpirationDays: ${JWT_REFRESH_EXP_DAYS:30}

payment:
  gateway:
    # mock (par défaut, dev/test, voir MockPaymentGatewayClient, NoOpWebhookVerifier) | moov (une
    # fois les vraies implémentations MoovPaymentGatewayClient/MoovWebhookVerifier écrites, voir
    # PaymentGatewayClient/WebhookVerifier). Ce même réglage pilote aussi la vérification
    # d'authenticité du webhook Moov (tâche 10) : tant qu'il vaut mock, AUCUNE vérification de
    # signature n'est faite (voir NoOpWebhookVerifier, warning explicite dans les logs).
    provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
    # Fréquence du job de vérification de secours des paiements PENDING (voir
    # PendingPaymentCheckTask). Le seuil d'âge à partir duquel un paiement est vérifié est lui
    # configurable en base sans redéploiement (voir migration V34, AppSettingService).
    pending-check-interval-ms: ${PAYMENT_PENDING_CHECK_INTERVAL_MS:60000}

whatsapp:
  otp:
    # mock (par défaut, dev/test, voir MockWhatsAppOtpSender — logue le code sans l'envoyer) | meta
    # (Meta WhatsApp Cloud API, voir MetaWhatsAppOtpSender, LocalOtpVerificationProvider) | twilio
    # (Twilio Verify, voir TwilioVerifyOtpProvider — génère/stocke/vérifie le code lui-même). Même
    # principe que payment.gateway.provider.
    provider: ${WHATSAPP_OTP_PROVIDER:mock}
    meta:
      # developers.facebook.com > votre app > WhatsApp > Configuration de l'API.
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      # Nom + langue du template "Authentication" approuvé (WhatsApp Manager > Modèles de
      # messages) — voir MetaWhatsAppOtpSender pour le format de payload attendu.
      template-name: ${WHATSAPP_TEMPLATE_NAME:otp_code}
      template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:ar}
      api-version: ${WHATSAPP_API_VERSION:v21.0}
    twilio:
      # console.twilio.com > Account > API keys & tokens (Account SID + Auth Token), et Verify >
      # Services > le Verify Service rattaché au sender WhatsApp (ex. "Omraty WhatsApp").
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  webhook:
    # Requis par Meta pour finaliser la configuration production d'un numéro WhatsApp (voir
    # WhatsAppWebhookController) — comparé tel quel au hub.verify_token envoyé par Meta au moment
    # de la configuration du webhook dans WhatsApp Manager.
    verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

app:
  vip:
    offer-expiration-hours: ${VIP_OFFER_EXPIRATION_HOURS:24}
  firebase:
    # Contenu JSON de la clé de compte de service Firebase (Firebase Console > Paramètres du
    # projet > Comptes de service > Générer une nouvelle clé privée), ou chemin vers ce fichier
    # JSON. Voir FirebaseConfig.
    service-account-key: ${FIREBASE_SERVICE_ACCOUNT_KEY:}
  upload:
    provider: ${UPLOAD_PROVIDER:local} # local | s3
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:/uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:eu-west-3}
